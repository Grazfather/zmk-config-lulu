CONFIG_ZMK_USB=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
# Breathe pattern
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1

# Enable the SSD1306 display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Give extra stack space required for the LVGL tasks
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# SSD1306 is monochrome — match LVGL color depth to avoid rendering garbage
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_USE_THEME_MONO=y
# LV_Z_BITS_PER_PIXEL does not auto-follow LV_COLOR_DEPTH; fix it manually so
# the static VDB buffer is sized correctly. At 1bpp a full 128x32 screen is
# only 512 bytes, so use 100% VDB to guarantee the rounder (128x8 minimum)
# always fits in the buffer.
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_VDB_SIZE=100
